[package]
name = "flectar-mail-sync-crypto"
description = "Key schedule, record sealing and signed membership operations of Flectar Mail Sync"
license = "Apache-2.0"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true

[dependencies]
bip39.workspace = true
chacha20poly1305.workspace = true
ed25519-dalek.workspace = true
getrandom.workspace = true
hkdf.workspace = true
hpke = { workspace = true, optional = true }
hmac.workspace = true
sha2.workspace = true
thiserror.workspace = true
zeroize.workspace = true

[features]
# Key wrapping to devices (HPKE with the X-Wing hybrid KEM). Devices need it;
# the server never wraps or unwraps keys.
kem = ["dep:hpke"]

[dev-dependencies]
hex.workspace = true

[lints]
workspace = true
